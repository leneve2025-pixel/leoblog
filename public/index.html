<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光酱喵的知识星球</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<style>
:root {
  --pink: #ff9ecd; --pink-deep: #ff6fb5; --lavender: #c9a7ff; --purple: #9d7bff;
  --blue: #7bc4ff; --cream: #fff8fc; --ink: #5a4a6e; --ink-light: #9b8bb5;
  --glass: rgba(255,255,255,.72); --glass-border: rgba(255,255,255,.85);
  --shadow: 0 12px 40px rgba(157,123,255,.18);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Noto Sans SC',sans-serif; color:var(--ink); min-height:100vh;
  background: linear-gradient(180deg,#140e2e 0%,#2a1c50 45%,#4b2f6e 75%,#7a4a8f 100%);
  background-attachment: fixed; overflow-x:hidden;
}
/* 闪烁星空 + 流星雨画布 */
#sky { position:fixed; inset:0; z-index:0; pointer-events:none; }

/* ===== 顶栏 ===== */
header {
  position:sticky; top:0; z-index:100; backdrop-filter: blur(16px);
  background:rgba(255,255,255,.55); border-bottom:1px solid rgba(255,255,255,.7);
  box-shadow:0 4px 24px rgba(255,111,181,.12);
}
.nav { max-width:1100px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:18px; }
.logo { font-family:'ZCOOL KuaiLe'; font-size:26px; cursor:pointer; display:flex; align-items:center; gap:10px;
  background:linear-gradient(90deg,var(--pink-deep),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent;
  transition:transform .3s; }
.logo:hover { transform:scale(1.05) rotate(-2deg); }
.logo .paw { font-size:28px; -webkit-text-fill-color:initial; }
.nav-links { margin-left:auto; display:flex; align-items:center; gap:8px; }
.nav-btn { border:none; background:transparent; font-family:inherit; font-size:15px; color:var(--ink);
  padding:9px 16px; border-radius:999px; cursor:pointer; transition:all .25s; display:flex; align-items:center; gap:6px; }
.nav-btn:hover { background:rgba(255,158,205,.18); color:var(--pink-deep); transform:translateY(-2px); }
.nav-btn.primary { background:linear-gradient(135deg,var(--pink),var(--lavender)); color:#fff;
  box-shadow:0 6px 18px rgba(255,111,181,.35); }
.nav-btn.primary:hover { box-shadow:0 8px 24px rgba(255,111,181,.5); color:#fff; }
.nav-avatar { width:38px; height:38px; border-radius:50%; object-fit:cover; cursor:pointer;
  border:2.5px solid #fff; box-shadow:0 3px 10px rgba(157,123,255,.35); transition:transform .25s; }
.nav-avatar:hover { transform:scale(1.12) rotate(5deg); }
.nav-avatar-placeholder { width:38px; height:38px; border-radius:50%; cursor:pointer; display:flex; align-items:center;
  justify-content:center; background:linear-gradient(135deg,var(--lavender),var(--blue)); color:#fff; font-size:17px;
  border:2.5px solid #fff; box-shadow:0 3px 10px rgba(157,123,255,.35); transition:transform .25s; }
.nav-avatar-placeholder:hover { transform:scale(1.12) rotate(5deg); }

main { max-width:1100px; margin:0 auto; padding:30px 24px 80px; position:relative; z-index:1; }
.view { display:none; animation: fadeUp .5s ease; }
.view.active { display:block; }
@keyframes fadeUp { from{opacity:0; transform:translateY(24px)} to{opacity:1; transform:translateY(0)} }

/* ===== 首页 Hero ===== */
.hero { text-align:center; padding:56px 20px 46px; position:relative; }
/* ===== Hero 大星球 ===== */
.hero-planet { position:relative; width:130px; height:110px; margin:0 auto;
  animation: bob 3s ease-in-out infinite; filter:drop-shadow(0 10px 20px rgba(157,123,255,.45)); }
.hero-planet .p-body { position:absolute; top:13px; left:23px; width:84px; height:84px; border-radius:50%; z-index:2;
  background:radial-gradient(circle at 32% 28%, #ffe0f0 0%, var(--pink) 38%, var(--purple) 82%, #6d4fd0 100%);
  box-shadow: inset -12px -14px 24px rgba(90,60,140,.38), inset 8px 10px 18px rgba(255,255,255,.45); }
.hero-planet .p-body::before { content:''; position:absolute; border-radius:50%;
  width:14px; height:14px; left:18px; top:44px; background:rgba(255,255,255,.28);
  box-shadow: 34px -26px 0 -3px rgba(255,255,255,.22), 26px 14px 0 -5px rgba(109,79,208,.3); }
.hero-planet .p-ring { position:absolute; top:50%; left:50%; width:128px; height:40px; border-radius:50%;
  border:7px solid rgba(201,167,255,.9); transform:translate(-50%,-50%) rotate(-16deg); }
.hero-planet .p-ring.back { z-index:1; box-shadow:0 0 14px rgba(201,167,255,.55); }
.hero-planet .p-ring.front { z-index:3; clip-path:inset(52% 0 0 0); border-color:rgba(255,220,240,.95); }
.hero-planet .p-moon { position:absolute; width:16px; height:16px; border-radius:50%; z-index:4;
  right:6px; top:8px; background:radial-gradient(circle at 35% 30%, #fff, #ffe28a 60%, #ffb84d);
  box-shadow:0 0 12px 3px rgba(255,226,138,.75); animation: moonTwinkle 2.4s ease-in-out infinite; }
@keyframes moonTwinkle { 0%,100%{transform:scale(.85); opacity:.8} 50%{transform:scale(1.1); opacity:1} }
@keyframes bob { 0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-14px) rotate(4deg)} }
.hero h1 { font-family:'ZCOOL KuaiLe'; font-size:52px; margin:14px 0 10px;
  background:linear-gradient(90deg,#ff6fb5,#9d7bff,#7bc4ff); -webkit-background-clip:text; background-clip:text; color:transparent;
  letter-spacing:2px; }
.hero p { color:rgba(255,255,255,.78); font-size:17px; letter-spacing:1px; }
.hero-actions { margin-top:26px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
.btn { border:none; font-family:inherit; font-size:15px; padding:12px 26px; border-radius:999px; cursor:pointer;
  transition:all .25s; display:inline-flex; align-items:center; gap:8px; }
.btn-primary { background:linear-gradient(135deg,var(--pink-deep),var(--purple)); color:#fff; box-shadow:0 8px 22px rgba(255,111,181,.4); }
.btn-primary:hover { transform:translateY(-3px) scale(1.03); box-shadow:0 12px 30px rgba(255,111,181,.55); }
.btn-ghost { background:var(--glass); border:1.5px solid var(--glass-border); color:var(--ink); }
.btn-ghost:hover { transform:translateY(-3px); box-shadow:var(--shadow); }
.btn-danger { background:linear-gradient(135deg,#ff7b7b,#ff5a8a); color:#fff; }
.btn-sm { padding:7px 15px; font-size:13px; }
.btn:disabled { opacity:.55; cursor:not-allowed; transform:none !important; }

.section-title { font-family:'ZCOOL KuaiLe'; font-size:28px; margin:38px 0 20px; display:flex; align-items:center; gap:10px; color:#f4ecff; }
.section-title::after { content:''; flex:1; height:2px; border-radius:2px;
  background:linear-gradient(90deg,rgba(255,158,205,.55),transparent); }

/* ===== 星球卡片 ===== */
.planet-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:22px; }
.planet-card { background:var(--glass); backdrop-filter:blur(12px); border:1.5px solid var(--glass-border);
  border-radius:24px; padding:26px; cursor:pointer; transition:all .35s cubic-bezier(.2,.9,.3,1.3);
  position:relative; overflow:hidden; box-shadow:0 6px 20px rgba(157,123,255,.1); }
.planet-card:hover { transform:translateY(-8px) scale(1.02); box-shadow:0 18px 44px rgba(255,111,181,.28); }
.planet-card::before { content:''; position:absolute; top:-40px; right:-40px; width:130px; height:130px;
  border-radius:50%; background:var(--pc,linear-gradient(135deg,var(--pink),var(--lavender))); opacity:.22; transition:all .35s; }
.planet-card:hover::before { transform:scale(1.5); opacity:.3; }
.planet-icon { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:32px; background:var(--pc,linear-gradient(135deg,var(--pink),var(--lavender)));
  box-shadow:0 8px 20px rgba(157,123,255,.35), inset 0 -6px 12px rgba(0,0,0,.08);
  animation: planetSpin 8s ease-in-out infinite; }
@keyframes planetSpin { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg) translateY(-4px)} }
.planet-card h3 { font-family:'ZCOOL KuaiLe'; font-size:22px; margin:14px 0 6px; }
.planet-card .desc { font-size:14px; color:var(--ink-light); line-height:1.6; min-height:22px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.planet-meta { margin-top:14px; display:flex; align-items:center; gap:12px; font-size:12.5px; color:var(--ink-light); }
.planet-meta .owner { display:flex; align-items:center; gap:5px; }
.badge-count { margin-left:auto; background:rgba(157,123,255,.14); color:var(--purple);
  padding:3px 11px; border-radius:999px; font-weight:500; }
.empty { text-align:center; padding:60px 20px; color:rgba(255,255,255,.62); }
.empty .big { font-size:56px; display:block; margin-bottom:12px; }

/* ===== 文章列表 / 详情 ===== */
.post-card { background:var(--glass); backdrop-filter:blur(12px); border:1.5px solid var(--glass-border);
  border-radius:20px; padding:22px 26px; margin-bottom:16px; cursor:pointer; transition:all .3s;
  box-shadow:0 4px 14px rgba(157,123,255,.08); }
.post-card:hover { transform:translateX(6px); box-shadow:var(--shadow); border-color:rgba(255,158,205,.6); }
.post-card h3 { font-size:19px; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.post-card h3:hover { color:var(--pink-deep); }
.post-meta { font-size:13px; color:var(--ink-light); display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
.paper { background:var(--glass); backdrop-filter:blur(14px); border:1.5px solid var(--glass-border);
  border-radius:26px; padding:44px 48px; box-shadow:var(--shadow); }
.paper h1 { font-family:'ZCOOL KuaiLe'; font-size:34px; margin-bottom:14px; }
.paper .content { margin-top:26px; font-size:16px; line-height:2; word-break:break-word; }
/* Markdown 渲染样式 */
.md-body h1,.md-body h2,.md-body h3,.md-body h4 { font-family:'ZCOOL KuaiLe'; margin:22px 0 10px; line-height:1.5; }
.md-body h1 { font-size:26px; border-bottom:2px solid rgba(255,158,205,.35); padding-bottom:8px; }
.md-body h2 { font-size:22px; } .md-body h3 { font-size:19px; }
.md-body p { margin:10px 0; }
.md-body a { color:var(--pink-deep); text-decoration:none; border-bottom:1px dashed var(--pink); }
.md-body a:hover { color:var(--purple); }
.md-body code { background:rgba(157,123,255,.13); color:#c0392b; padding:2px 7px; border-radius:6px;
  font-size:14px; font-family:Consolas,Monaco,monospace; }
.md-body pre { background:#3d3252; color:#f8f0ff; padding:16px 18px; border-radius:14px; overflow-x:auto;
  margin:14px 0; box-shadow:inset 0 2px 8px rgba(0,0,0,.25); }
.md-body pre code { background:none; color:inherit; padding:0; font-size:13.5px; line-height:1.7; }
.md-body blockquote { border-left:4px solid var(--pink); background:rgba(255,158,205,.1);
  padding:10px 18px; margin:14px 0; border-radius:0 12px 12px 0; color:var(--ink-light); }
.md-body ul,.md-body ol { padding-left:26px; margin:10px 0; }
.md-body li { margin:5px 0; }
.md-body img { max-width:100%; border-radius:14px; box-shadow:0 6px 18px rgba(157,123,255,.2); }
.md-body table { margin:14px 0; } .md-body th { text-align:left; }
.md-body hr { border:none; height:2px; margin:22px 0; border-radius:2px;
  background:linear-gradient(90deg,var(--pink),var(--lavender),transparent); }
.md-body input[type=checkbox] { margin-right:6px; accent-color:var(--pink-deep); }
.back-link { display:inline-flex; align-items:center; gap:6px; color:#d3bfff; cursor:pointer;
  font-size:14px; margin-bottom:18px; transition:gap .2s; }
.back-link:hover { gap:10px; }
.planet-hero { text-align:center; padding:30px 0 10px; }
.planet-hero .planet-icon { width:90px; height:90px; font-size:46px; margin:0 auto; }
.planet-hero h1 { font-family:'ZCOOL KuaiLe'; font-size:36px; margin:14px 0 6px; color:#fff; }
.planet-hero p { color:rgba(255,255,255,.75); }
.perm-tag { display:inline-block; font-size:12.5px; background:rgba(255,255,255,.16); color:#ffe9f6;
  padding:4px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.25); }

/* ===== 弹窗 ===== */
.modal-mask { position:fixed; inset:0; background:rgba(90,74,110,.35); backdrop-filter:blur(6px);
  z-index:200; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-mask.show { display:flex; animation:fadeIn .25s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal { background:rgba(255,255,255,.92); backdrop-filter:blur(20px); border-radius:26px; padding:34px 36px;
  width:100%; max-width:440px; max-height:88vh; overflow-y:auto; box-shadow:0 24px 70px rgba(90,74,110,.35);
  border:1.5px solid #fff; animation:popIn .35s cubic-bezier(.2,.9,.3,1.3); position:relative; }
.modal.wide { max-width:640px; }
@keyframes popIn { from{opacity:0; transform:scale(.85) translateY(30px)} to{opacity:1; transform:scale(1) translateY(0)} }
.modal h2 { font-family:'ZCOOL KuaiLe'; font-size:26px; margin-bottom:20px; text-align:center; }
.modal-close { position:absolute; top:16px; right:18px; border:none; background:rgba(157,123,255,.12);
  width:32px; height:32px; border-radius:50%; cursor:pointer; color:var(--ink); font-size:14px; transition:all .2s; }
.modal-close:hover { background:var(--pink); color:#fff; transform:rotate(90deg); }
.tabs { display:flex; gap:8px; margin-bottom:22px; background:rgba(157,123,255,.1); padding:5px; border-radius:999px; }
.tab { flex:1; text-align:center; padding:9px; border-radius:999px; cursor:pointer; font-size:14px;
  transition:all .25s; color:var(--ink-light); border:none; background:transparent; font-family:inherit; }
.tab.active { background:linear-gradient(135deg,var(--pink),var(--lavender)); color:#fff; box-shadow:0 4px 12px rgba(255,111,181,.35); }
.field { margin-bottom:16px; }
.field label { display:block; font-size:13.5px; margin-bottom:7px; color:var(--ink); font-weight:500; }
.field input[type=text], .field input[type=password], .field textarea, .field select {
  width:100%; padding:12px 16px; border-radius:14px; border:1.5px solid rgba(157,123,255,.25);
  background:rgba(255,255,255,.8); font-family:inherit; font-size:14.5px; color:var(--ink);
  outline:none; transition:all .25s; }
.field input:focus, .field textarea:focus, .field select:focus {
  border-color:var(--pink); box-shadow:0 0 0 4px rgba(255,158,205,.18); }
.field textarea { min-height:150px; resize:vertical; line-height:1.8; }
.gender-group { display:flex; gap:10px; }
.gender-opt { flex:1; text-align:center; padding:10px; border-radius:14px; border:1.5px solid rgba(157,123,255,.25);
  cursor:pointer; font-size:14px; transition:all .2s; background:rgba(255,255,255,.7); }
.gender-opt:hover { transform:translateY(-2px); }
.gender-opt.sel { border-color:var(--pink); background:rgba(255,158,205,.18); color:var(--pink-deep); font-weight:500; }
.form-error { color:#ff5a8a; font-size:13px; margin:-6px 0 12px; min-height:18px; text-align:center; }
.w-full { width:100%; justify-content:center; }

/* ===== 个人中心 / 管理后台 ===== */
.profile-card { background:var(--glass); backdrop-filter:blur(14px); border:1.5px solid var(--glass-border);
  border-radius:26px; padding:36px; box-shadow:var(--shadow); margin-bottom:24px; }
.profile-head { display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
.big-avatar { width:110px; height:110px; border-radius:50%; object-fit:cover; border:4px solid #fff;
  box-shadow:0 10px 26px rgba(157,123,255,.35); }
.big-avatar-placeholder { width:110px; height:110px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:46px; color:#fff; background:linear-gradient(135deg,var(--lavender),var(--blue));
  border:4px solid #fff; box-shadow:0 10px 26px rgba(157,123,255,.35); }
.avatar-upload { position:relative; display:inline-block; }
.avatar-edit-btn { position:absolute; bottom:2px; right:2px; width:34px; height:34px; border-radius:50%;
  background:linear-gradient(135deg,var(--pink-deep),var(--purple)); color:#fff; border:2.5px solid #fff;
  cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:transform .2s; }
.avatar-edit-btn:hover { transform:scale(1.15); }
.role-tag { display:inline-block; font-size:12px; padding:3px 12px; border-radius:999px; margin-left:8px; vertical-align:middle; }
.role-user { background:rgba(123,196,255,.2); color:#3d8fd1; }
.role-admin { background:rgba(255,158,205,.25); color:var(--pink-deep); }
.role-super_admin { background:linear-gradient(135deg,#ffd166,#ff9ecd); color:#a05000; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th { text-align:left; padding:12px 14px; color:var(--ink-light); font-weight:500; font-size:13px;
  border-bottom:2px solid rgba(157,123,255,.2); }
td { padding:12px 14px; border-bottom:1px solid rgba(157,123,255,.12); vertical-align:middle; }
tr:hover td { background:rgba(255,158,205,.07); }
.mini-avatar { width:34px; height:34px; border-radius:50%; object-fit:cover; border:2px solid #fff;
  box-shadow:0 2px 6px rgba(157,123,255,.3); }
.mini-avatar-ph { width:34px; height:34px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--lavender),var(--blue)); color:#fff; font-size:14px; border:2px solid #fff; }

/* ===== 浮窗公告 ===== */
.announce-btn { position:fixed; right:26px; bottom:26px; z-index:150; width:52px; height:52px; border-radius:50%;
  border:2.5px solid #fff; background:linear-gradient(135deg,var(--pink-deep),var(--purple)); color:#fff; font-size:22px;
  cursor:pointer; box-shadow:0 8px 22px rgba(255,111,181,.45); display:none; align-items:center; justify-content:center;
  transition:transform .25s; animation: bob 3s ease-in-out infinite; }
.announce-btn:hover { transform:scale(1.12); }
.announce-dot { position:absolute; top:1px; right:1px; width:13px; height:13px; border-radius:50%;
  background:#ff5a5a; border:2px solid #fff; display:none; animation: moonTwinkle 1.6s ease-in-out infinite; }
.announce-panel { position:fixed; right:26px; bottom:26px; z-index:150; width:300px; max-width:calc(100vw - 40px);
  background:rgba(255,255,255,.92); backdrop-filter:blur(16px); border:1.5px solid #fff; border-radius:20px;
  box-shadow:0 16px 44px rgba(157,123,255,.3); padding:18px 20px; display:none; }
.announce-panel.show { display:block; animation:popIn .35s cubic-bezier(.2,.9,.3,1.3); }
.announce-title { font-family:'ZCOOL KuaiLe'; font-size:17px; display:flex; align-items:center;
  justify-content:space-between; margin-bottom:8px; color:var(--pink-deep); }
.announce-close { border:none; background:rgba(157,123,255,.12); width:24px; height:24px; border-radius:50%;
  cursor:pointer; color:var(--ink); font-size:12px; transition:all .2s; }
.announce-close:hover { background:var(--pink); color:#fff; transform:rotate(90deg); }
.announce-body { font-size:14px; line-height:1.8; color:var(--ink); white-space:pre-wrap;
  word-break:break-word; max-height:40vh; overflow-y:auto; }

/* toast */
#toast { position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:300;
  background:rgba(90,74,110,.92); color:#fff; padding:12px 26px; border-radius:999px; font-size:14.5px;
  opacity:0; pointer-events:none; transition:all .35s; box-shadow:0 10px 30px rgba(0,0,0,.25); }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
#toast.err { background:linear-gradient(135deg,#ff7b7b,#ff5a8a); }
#toast.ok { background:linear-gradient(135deg,#5ad6a0,#4bb8e6); }

/* ===== 文章互动（赞/收藏/精华） ===== */
.post-actions { display:flex; align-items:center; gap:12px; margin-top:32px; padding-top:20px;
  border-top:2px dashed rgba(157,123,255,.25); flex-wrap:wrap; }
.act-btn { border:1.5px solid rgba(157,123,255,.3); background:rgba(255,255,255,.7); border-radius:999px;
  padding:9px 20px; font-size:14px; cursor:pointer; font-family:inherit; color:var(--ink);
  display:inline-flex; align-items:center; gap:7px; transition:all .25s; }
.act-btn:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(157,123,255,.25); }
.act-btn.on { background:linear-gradient(135deg,var(--pink),var(--lavender)); color:#fff; border-color:transparent; }
.essence-tag { background:linear-gradient(135deg,#ffd166,#ffb84d); color:#8a5200;
  padding:6px 16px; border-radius:999px; font-size:13px; font-weight:500;
  box-shadow:0 4px 12px rgba(255,184,77,.4); }

/* ===== 评论区 ===== */
.comments { margin-top:30px; }
.comment-item { display:flex; gap:12px; padding:14px 0; border-bottom:1px dashed rgba(157,123,255,.2); }
.comment-body { flex:1; min-width:0; }

<script>
// ============ 全局状态 ============
let me = null;           // 当前登录用户
let authTab = 'login';
let currentPlanet = null;
let currentPost = null;
let selGender = 'secret', selColor = 'pink', selIcon = '🪐', selPerm = 'everyone';

const COLORS = {
  pink:   { name:'樱花粉', css:'linear-gradient(135deg,#ff9ecd,#ff6fb5)' },
  purple: { name:'星云紫', css:'linear-gradient(135deg,#c9a7ff,#9d7bff)' },
  blue:   { name:'海洋蓝', css:'linear-gradient(135deg,#7bc4ff,#4b9be6)' },
  mint:   { name:'薄荷绿', css:'linear-gradient(135deg,#8be8c7,#4ecf9e)' },
  orange: { name:'蜜柑橙', css:'linear-gradient(135deg,#ffc98b,#ff9a5a)' }
};
const ICONS = ['🪐','🌙','⭐','🌍','🌸','🍓','🐱','🦄'];
const PERMS = {
  personal:    { name:'🐱 个人创作', hint:'只有你自己（星球主）可以在这颗星球发文' },
  everyone:    { name:'🌍 所有人创作', hint:'所有登录用户都可以在这颗星球发文' },
  owner_admin: { name:'🛡️ 管理员+个人创作', hint:'只有你和管理员（含站长）可以在这颗星球发文' }
};
const GENDERS = { male:['male','♂ 男生','#4b9be6'], female:['female','♀ 女生','#ff6fb5'], secret:['secret','🐾 保密','#9d7bff'] };

// ============ 工具 ============
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = s => new Date(s).toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
async function api(url, method, body) {
  const opt = { method: method || 'GET', headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const res = await fetch(url, opt);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('请求失败 ' + res.status));
  return data;
}
let toastTimer;
function toast(msg, type) {
  const t = $('toast');
  t.textContent = msg; t.className = 'show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 2600);
}
function avatarHtml(u, cls, phCls) {
  if (u && u.avatar) return `<img class="${cls}" src="${u.avatar}" alt="">`;
  const ch = u && u.username ? esc(u.username[0].toUpperCase()) : '🐱';
  return `<span class="${phCls}">${ch}</span>`;
}
function roleTag(role) {
  const map = { user:['喵友','role-user'], admin:['管理员','role-admin'], super_admin:['站长','role-super_admin'] };
  const m = map[role] || map.user;
  return `<span class="role-tag ${m[1]}">${m[0]}</span>`;
}

// ============ 浮窗公告 ============
let announcement = '';
function announceHash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return String(h); }
function applyAnnouncement(text) {
  announcement = (text || '').trim();
  const panel = $('announce-panel'), btn = $('announce-btn'), dot = $('announce-dot');
  if (!announcement) { panel.classList.remove('show'); btn.style.display = 'none'; return; }
  $('announce-body').textContent = announcement;
  btn.style.display = 'flex';
  const unseen = localStorage.getItem('announce-seen') !== announceHash(announcement);
  dot.style.display = unseen ? 'block' : 'none';
  if (unseen) panel.classList.add('show');
}
function markAnnounceSeen() {
  localStorage.setItem('announce-seen', announceHash(announcement));
  $('announce-dot').style.display = 'none';
}
function toggleAnnounce() {
  const panel = $('announce-panel');
  panel.classList.toggle('show');
  if (panel.classList.contains('show')) markAnnounceSeen();
}
function dismissAnnounce() {
  $('announce-panel').classList.remove('show');
  markAnnounceSeen();
}

// ============ 闪烁星空 + 流星雨背景 ============
(function initSky() {
  const cv = $('sky');
  const ctx = cv.getContext('2d');
  let W, H, stars = [], meteors = [];
  function resize() {
    W = cv.width = innerWidth;
    H = cv.height = innerHeight;
    stars = [];
    const n = Math.min(240, Math.floor(W * H / 8000));
    for (let i = 0; i < n; i++) stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.6 + .4,
      base: Math.random() * .5 + .3,
      sp: Math.random() * .9 + .3,
      ph: Math.random() * Math.PI * 2
    });
  }
  resize();
  addEventListener('resize', resize);
  function spawnMeteor() {
    const fromLeft = Math.random() < .5;
    const ang = fromLeft
      ? Math.PI / 4 + (Math.random() - .5) * .3
      : Math.PI * 3 / 4 + (Math.random() - .5) * .3;
    const sp = Math.random() * 4 + 6;
    meteors.push({
      x: Math.random() * W * .7 + W * .15,
      y: Math.random() * H * .3,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      life: 1, decay: Math.random() * .008 + .009
    });
    setTimeout(spawnMeteor, Math.random() * 3500 + 1800);
  }
  setTimeout(spawnMeteor, 1000);
  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    // 闪烁星星
    for (const s of stars) {
      const a = s.base + Math.sin(t / 1000 * s.sp + s.ph) * .35;
      ctx.globalAlpha = Math.max(.05, a);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
      if (s.r > 1.3) { // 亮星加光晕
        ctx.globalAlpha *= .3;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 2.8, 0, 7); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    // 流星雨
    meteors = meteors.filter(m => m.life > 0);
    for (const m of meteors) {
      m.x += m.vx; m.y += m.vy; m.life -= m.decay;
      const len = Math.hypot(m.vx, m.vy);
      const tail = 90 * m.life + 40;
      const tx = m.x - m.vx / len * tail;
      const ty = m.y - m.vy / len * tail;
      const g = ctx.createLinearGradient(m.x, m.y, tx, ty);
      g.addColorStop(0, 'rgba(255,255,255,' + (.9 * Math.max(m.life, 0)) + ')');
      g.addColorStop(1, 'rgba(255,180,220,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.globalAlpha = Math.max(m.life, 0);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(m.x, m.y, 1.8, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

async function refreshAuth() {
  try {
    const s = await api('/api/auth/status');
    me = s.loggedIn ? s.user : null;

  const favBtn = `<button class="nav-btn" onclick="openFavorites()"><i class="fa-solid fa-star"></i>收藏库</button>`;
  box.innerHTML = favBtn + adminBtn + av +
    `<button class="nav-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>退出</button>`;
}

  toast('已退出登录，下次再来玩喵~', 'ok');
}

// ============ 认证弹窗 ============
function genderGroupHtml(el, selected, onPick) {
  el.innerHTML = Object.values(GENDERS).map(([v, label]) =>
    `<div class="gender-opt ${v === selected ? 'sel' : ''}" data-g="${v}">${label}</div>`).join('');
  el.querySelectorAll('.gender-opt').forEach(o => o.onclick = () => {
    el.querySelectorAll('.gender-opt').forEach(x => x.classList.remove('sel'));
    o.classList.add('sel'); onPick(o.dataset.g);
  });
}
function openAuth(tab) {
  switchAuthTab(tab || 'login');
  $('modal-auth').classList.add('show');
}
function switchAuthTab(t) {
  authTab = t;

function uploadAvatar(input) {
  const file = input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) return toast('请选择图片文件喵', 'err');
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = async () => {
      const canvas = document.createElement('canvas');
      const size = 160;
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const min = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, size, size);
      try {
        const data = await api('/api/profile/avatar', 'PUT', { avatar: canvas.toDataURL('image/jpeg', 0.85) });
        me = data.user; renderNav(); openProfile();
        toast('头像更新成功喵！', 'ok');
      } catch (err) { toast(err.message, 'err'); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

  try {
    const users = await api('/api/admin/users');
    tbody.innerHTML = users.map(u => `
      <tr>
        <td>${avatarHtml(u, 'mini-avatar', 'mini-avatar-ph')}</td>
        <td>${esc(u.username)}</td>
        <td>${(Object.values(GENDERS).find(g => g[0] === u.gender) || GENDERS.secret)[1]}</td>
        <td>${roleTag(u.role)}</td>
        <td>${fmtDate(u.createdAt).split(' ')[0]}</td>
        <td>${u.role === 'super_admin' ? '<span style="color:var(--ink-light);font-size:12px">站长不可操作</span>' : `
          <button class="btn btn-ghost btn-sm" onclick="resetPwd('${esc(u.username)}')"><i class="fa-solid fa-rotate-left"></i>重置密码</button>
          <button class="btn btn-danger btn-sm" onclick="deleteUser('${esc(u.username)}')"><i class="fa-solid fa-trash"></i>删除</button>`}
        </td>
      </tr>`).join('') || '<tr><td colspan="6" class="empty">暂无账号</td></tr>';
  } catch (e) { tbody.innerHTML = `<tr><td colspan="6">${esc(e.message)}</td></tr>`; }
}
async function resetPwd(username) {
  if (!confirm(`确定将 ${username} 的密码重置为 123456 吗？`)) return;
  try { await api(`/api/admin/users/${encodeURIComponent(username)}/reset-password`, 'PUT'); toast('已重置为 123456', 'ok'); }
  catch (e) { toast(e.message, 'err'); }
}
async function deleteUser(username) {
  if (!confirm(`确定删除账号 ${username} 吗？此操作不可恢复！`)) return;
  try { await api(`/api/admin/users/${encodeURIComponent(username)}`, 'DELETE'); toast('账号已删除', 'ok'); loadAdminUsers(); }
  catch (e) { toast(e.message, 'err'); }
}
async function saveConfig() {
  try {
    const data = await api('/api/config', 'PUT', { blogTitle: $('cfg-title').value.trim(), subtitle: $('cfg-subtitle').value.trim(), announcement: $('cfg-announcement').value.trim() });
    applyConfig(data.config);
    toast('站点设置已保存', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}
function applyConfig(cfg) {
  if (!cfg) return;
  if (cfg.blogTitle) {
    $('site-title').textContent = cfg.blogTitle;
    $('hero-title').textContent = cfg.blogTitle;
    document.title = cfg.blogTitle;
  }
  if (cfg.subtitle !== undefined) $('hero-subtitle').textContent = cfg.subtitle;
  applyAnnouncement(cfg.announcement);
}

// ============ 启动 ============
(async function boot() {
  genderGroupHtml($('auth-gender'), selGender, g => selGender = g);
  $('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); });
  await refreshAuth();
  try { applyConfig(await api('/api/config')); } catch (e) {}
  loadPlanets();
})();
</script>
</body>
</html>
